# 本仓只支持 Windows（README「支持范围」里写死了），所以 runner 只有 windows-latest。
# 别加 linux/macos：Rust 侧与 tools/*.cmd、*.ps1 里有 Windows 专属行为，
# 在别的系统上"绿"了也证明不了任何事，只会拖慢 PR。
#
# action 版本（2026-10 升到当前 major）：
#   · checkout / setup-node / upload-artifact 都在 v7。三个都跑在 Node 24 运行时上。
#     setup-node v6 起**自动缓存只认 npm**（别的包管理器得自己配 cache），
#     本仓三条 job 都只用 `cache: npm`，不受影响。
#     upload-artifact v6 起要求 runner ≥ 2.327.1（GitHub 托管的 runner 本来就够），
#     v7 新增"单文件直传"（`archive: false`），本仓传的是打包产物，保持默认打包上传。
#   · rust-cache 还是 v2、tauri-action 还是 v1 —— 这两个没有更新的 major。
#     install-action 的 `cargo-audit` 标签与 `releases/cargo-audit` 分支指向同一个提交，
#     换过去没有意义。
#   · node-version 仍钉 24（不带 .x）：package.json 的 engines 要求 >=24，
#     而"24 这一支的最新版"就是升级策略本身，26 出了也不跟着跳。
name: CI

on:
  push:
    branches: [main]
    # 打上 `v*` 标签 = 要发一个版本：那条由 `release` 那条 job 出包并建 release。
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: 前端：装依赖 → 类型检查 → 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # package.json 的 engines 要求 >=24，所以这里钉 24（**不带 .x**：
          # 意思是"24 这一支的最新版"，26 出了也不会跟着跳）。
          node-version: 24
          cache: npm

      # 官方源：npmmirror 这类镜像不实现 audit 端点（/-/npm/v1/security/* not implemented），
      # 拿镜像跑会得到一个假绿。CI 不用配 registry，沿用默认的 registry.npmjs.org。
      - name: 装依赖（按 package-lock.json 精确还原）
        run: npm ci

      # typecheck 已经含在 build 里（build = typecheck && vite build），
      # 这里只跑一次 build，不拆成两步：tauri.conf.json 的 beforeBuildCommand 走的也是 build，
      # 拆开就会出现"CI 过了、打包却红在类型上"的那道缝。
      - name: 类型检查 + 构建
        run: npm run build

      # 文案标点闸门：`ui-copy-scan.mjs` 在标点有违规时退 1（清单条数不算违规）。
      # 它读 `src/**` 与 `src-tauri/src/**` 的**源码文本**，不读 dist，所以放在
      # 构建之后、rust 那条 job 之前当独立一道 —— 跑得快，且不需要 rclone。
      # 这条把 DESIGN.md「标点那条机械保证零违规」从"靠人读输出"变成真闸门。
      - name: 文案标点扫描（直引号括中文 / 中文句中的半角冒号）
        run: npm run copy:scan

      # `ui-copy-scan.mjs` 只收**含中文**的句子（它的 CN.test），所以一条纯英文的界面话
      # （`title="Delete"`、空状态、Tooltip）对那道闸门是隐形的。这一条补上那一半：
      # 只报散文，两词以上且含常见英文功能/状态词，CSS 值与标识符形状不算。
      # 依据是 README「界面语言：只有中文」—— 纯英文界面话是漏翻，不是风格选择。
      - name: 纯英文界面文案扫描（漏翻那一半）
        run: npm run copy:ascii

      # 上一条报「零条」有两种可能：真的干净，或者它已经瞎了 —— 从输出上看不出区别。
      # （真发生过：这道闸门的前两版对 `<Button>Delete</Button>` 与全小写短语全盲，
      #  却在 src/ 上报零条。）这一步拿一份**故意写错的**英文文案当靶子，断言它必须红。
      - name: 上一条闸门的自检（退化就红）
        run: npm run copy:ascii:selftest

      - name: npm 依赖漏洞（high 及以上即红）
        run: npm audit --audit-level=high

  rust:
    name: Rust：clippy → 全套测试（含真后台）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cargo.toml 在 src-tauri 而不是仓根，所以得指明工作区；
      # 不指的话这份缓存永远命中不了，每轮都要从头编 tauri（十几分钟）。
      #
      # `-> target` 才是 rust-cache 的规范写法：**target 目录是相对工作区给的**。
      # 写成 `-> .` 的话，target 目录就等于 `src-tauri` 自己 —— 整棵源码树
      # （连 Cargo.toml 与 src/ 一起）都进了缓存归档；归档一恢复，就把刚 checkout
      # 出来的工作区覆盖成旧快照。2026-10-20 升依赖时踩的就是这个：锁文件变了 →
      # 缓存键里的 lockfile 哈希跟着变 → 精确键未命中、restore-key 命中了旧归档 →
      # `src-tauri/Cargo.toml` 直接不见，clippy 报
      # "manifest path `src-tauri/Cargo.toml` does not exist"（那条 job 与打包那条同红）。
      # 只缓存 target/ 就不会碰到源码树。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo
          workspaces: src-tauri -> target
          # 缓存形态变了（不再把整棵 src-tauri 装进归档），前缀必须换掉：
          # 旧归档按 restore-key 仍会被命中并恢复，踩的就是上面那个坑。
          prefix-key: v1-rust

      # rclone 不是 mock：tests/rcd_supervisor、runner_local、mirror_runner、
      # browser_runner、draft_pairs 这五条目标起的是**真** rclone rcd。
      # 没装的话它们不是"失败"，而是连不上后台后集体红，报错还看不出根因。
      - name: 装 rclone
        run: choco install rclone --yes --no-progress

      # choco 往 PATH 里放的是**转发 shim**，shim 再把真正的 rclone 从包目录里拉起来。于是：
      #   · 起 daemon 时我们交出去的是 shim 的路径；
      #   · 真正绑住端口、真正跑 rcd 的是包目录里那个映像；
      #   · 而 `DaemonGuard::cmd_is_our_rcd` 与生产 `reclaim` 里的 `same_path`
      #     是拿 OS 报的**进程映像完整路径**去逐字符比的（那条判据的注释写着
      #     「完整路径，不是文件名——本机装着两个不同构建的 rclone.exe」）。
      # 两边对不上 → 守卫一次也不收尸 → daemon 泄漏 → 同一 target 里后面的用例
      # 全撞「端口被占」。2026-10-12 第一次真跑 CI 整批红就是这一条。
      #
      # 所以把 RCLONE_BIN 指到**真正的可执行文件**——夹具本来就留了这个出口
      # （rcd_supervisor.rs 那份 helper 的文档明写「可用 RCLONE_BIN 覆盖」）。
      #
      # 这里**刻意不写死包目录的路径**：choco 把包解到哪儿会随版本变，写死正是下一次
      # CI 又红的原因（第一版就是这么栽的：写死 lib\rclone 后在 runner 上找不到，直接 throw）。
      # 判据是性质而不是位置：
      #   ① 排除 chocolatey\bin（那是 shim 目录）；② 取体量最大的那个
      # （真程序几十 MB，shim 一百来 KB —— 本机实测 69.8 MB 对 94–142 KB）。
      # 候选一律打印出来，哪一步判断错了日志里一眼看得见。
      #
      # 找不到时**不硬失败**：这一步是配置，不该由它来挡 CI。退回 PATH 的解析结果并打告警，
      # 让测试自己给出可读的报错（守卫那条仍然是硬闸，症状照旧可见）。
      - name: 指向真正的 rclone 可执行文件（choco 放的是转发 shim）
        run: |
          $all = Get-ChildItem -Path 'C:\ProgramData\chocolatey','C:\tools' `
                               -Recurse -Filter rclone.exe -ErrorAction SilentlyContinue
          Write-Host '候选 rclone.exe：'
          $all | ForEach-Object { Write-Host ("  {0,8:N1} MB  {1}" -f ($_.Length/1MB), $_.FullName) }
          $real = $all |
                  Where-Object { $_.DirectoryName -notlike '*\chocolatey\bin' -and $_.Length -gt 1MB } |
                  Sort-Object Length -Descending | Select-Object -First 1
          if ($real) {
            Write-Host "选定: $($real.FullName)"
          } else {
            $fallback = (Get-Command rclone -ErrorAction SilentlyContinue).Source
            Write-Host "::warning::没找到真正的 rclone.exe，退回 PATH 的解析结果 $fallback"
            Write-Host "::warning::若下面的测试报「端口被占」或 SpawnFailed，多半就是这个原因"
            $real = Get-Item $fallback
          }
          # 不用 `Out-File -Encoding utf8`：Windows PowerShell 5.1 那一档会写 BOM（实测首字节 EF BB BF），
          # 而 GitHub 要求 GITHUB_ENV 是无 BOM 的 UTF-8 —— BOM 落在第一行会把 RCLONE_BIN
          # 这个**变量名本身**弄坏，症状是"设了却读不到"。
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "RCLONE_BIN=$($real.FullName)`n",
            (New-Object System.Text.UTF8Encoding $false))
          Write-Host "RCLONE_BIN = $($real.FullName)  ($([math]::Round($real.Length/1MB,1)) MB)"

      # README「支持范围」写的是实测钉在 v1.75.1。choco 装的是当时最新，
      # 所以这条**不**去卡版本（卡了就等于把 CI 冻在一个越旧越没人验的 rclone 上），
      # 只把实际版本摆出来：跑挂时先看这里是不是换了 rclone，而不是先怀疑代码。
      - name: 核对 rclone 版本（文档基准 v1.75.1，差异要人看一眼）
        run: |
          $v = (rclone version | Select-String '^rclone v').ToString().Trim()
          Write-Host "实际装到：$v"
          Write-Host "文档基准：rclone v1.75.1"
          if ($v -ne 'rclone v1.75.1') {
            Write-Host "::warning::CI 上的 rclone 与文档基准不一致（不阻断，见本步注释）"
          }

      # --features test-helpers 不能省：Cargo.toml 里那五条 [[test]] 都带
      # required-features，不开这个 flag 的话 cargo 会**静默跳过**它们，
      # clippy 看着全绿，其实最该看的那五个文件根本没被检查。
      - name: clippy
        run: npm run lint:rust

      # 走 npm test 而不是直接 cargo test：--test-threads=1 在脚本里，
      # 而那五条目标各要绑一个真后台端口，并发跑就是 "address already in use"。
      - name: 测试
        run: npm test

  security:
    name: 依赖漏洞：Rust advisory 数据库
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@cargo-audit

      # --json 让报告落成文件，失败时作为 artifact 传上去，
      # 省得有人为了看"到底哪条 CVE"再去本地重跑一遍。
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock --json > audit.json

      - name: 传审计报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-audit-report
          path: audit.json

  bundle:
    name: 打包：NSIS 安装包
    # 只在推 main 与手动触发时跑：NSIS 要现下、release 模式重编全量 Rust，
    # 对每个 PR 都做一遍不值当。PR 上"能编过"由 rust 那条 job 兜住。
    # 打标签的那一趟由 release 那条 job 出包（同一个安装包，还要多一份更新包），这里不重复出一次。
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 缓存只装 target/，不装整棵 src-tauri —— 理由与前缀为什么换，见上面 rust 那条里的注释。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-bundle
          workspaces: src-tauri -> target
          prefix-key: v1-rust

      - run: npm ci

      # `bundle.createUpdaterArtifacts` 开着时出包**必须**有私钥：更新包要它签名，
      # 没有私钥就出不了更新包（tauri 自己会拒）。私钥只从仓的 secret 来 ——
      # 仓里存的是公钥（`src-tauri/rclone-deck.pub`），私钥不入库、也不进这个文件。
      - name: 出安装包
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 传安装包
        uses: actions/upload-artifact@v7
        with:
          name: rclone-deck-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布：出安装包与更新包（草稿）
    # 标签是唯一版本源：第一步先断言 tag 与 package/tauri/Cargo 一致，然后 tauri-action
    # 直接使用**推送的 tag** 建唯一草稿；不再用 v__VERSION__ 让 action 按配置版本命名
    # （那会让错位标签落到另一个 release 名下）。
    # 测试门禁：frontend / rust 两条 job 全绿之后才启动这一条。
    needs: [frontend, rust]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # 建 release 要写权限：仓里默认给的是 `contents: read`（`permissions` 那块）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 断言 tag 与三处版本一致
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::$TAG 不是 vX.Y.Z"; exit 1; }
          v="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo="$(node -e "const fs=require('fs');const s=fs.readFileSync('src-tauri/Cargo.toml','utf8');const m=s.match(/^version = \"([^\"]+)\"/m);if(!m)process.exit(2);process.stdout.write(m[1])")"
          [ "$pkg" = "$v" ] || { echo "::error::version mismatch: package.json $pkg != tag $v"; exit 1; }
          [ "$conf" = "$v" ] || { echo "::error::version mismatch: tauri.conf.json $conf != tag $v"; exit 1; }
          [ "$cargo" = "$v" ] || { echo "::error::version mismatch: Cargo.toml $cargo != tag $v"; exit 1; }
          echo "version $v asserted in package.json / tauri.conf.json / Cargo.toml"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 缓存只装 target/，不装整棵 src-tauri —— 理由与前缀为什么换，见上面 rust 那条里的注释。
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-cargo-release
          workspaces: src-tauri -> target
          prefix-key: v1-rust

      - run: npm ci

      # 这一步出两样东西：安装包（`*-setup.exe`）与更新包（`latest.json` + 各个 `.sig`）。
      # 更新包是面板里那一项「检查更新」读的东西：端点写的是
      # `releases/latest/download/latest.json`，而 `releases/latest` **只认已发布的** release。
      # 所以出完还要把那个草稿**发布出去**（见下面 `releaseDraft` 那段）。
      - name: 出安装包与更新包
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私钥只从仓的 secret 来，值不进这个文件。仓里存的是公钥。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: rclone-deck ${{ github.ref_name }}
          releaseBody: |
            rclone-deck 桌面版（Windows）。

            面板在「设置」那面有一项「版本与更新」：**默认关着**，开了才会在每次打开时联网问一句
            有没有新版；也可以随时点「立即检查」。有新版时面板只说版本号，下载与安装要人自己按。

            **这个安装包没有做 Windows 代码签名**，首次运行会出现「未知发布者」/SmartScreen 提示；
            校验和与来源证明见 release 里的 `SHA256SUMS` 与 GitHub attestation。
          generateReleaseNotes: true
          # **草稿先建、后由下面的 publish job 自动发布**：发布之前，草稿是这一趟的
          # **重试锚点**——中途出了事重跑同一趟，tauri-action 会找到这个草稿把产物补进去，
          # 而不是撞「release already exists」。发布之后的重跑由 publish job 找回同 tag 的
          # 已发布 release，重新校验/覆盖校验和与 attestation；本 job 只出包与上传草稿。
          releaseDraft: true
          prerelease: false

      # 草稿由下面的 publish job 统一校验、计算 SHA256SUMS、生成 attestation、
      # 发布并标成 latest，再做一次匿名 feed 核验；本 job 只负责出包与上传草稿。

  publish:
    name: 发布：校验、SHA256SUMS、attestation、匿名核验
    needs: [release]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # 自动发布是本仓的显式取舍（.desktop-policy.json 的 release-auto-publish 有 reason/revisitWhen）；
    # 测试门禁由 release.needs [frontend, rust] 保证。
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: 取回这一趟的草稿资产
        run: |
          set -euo pipefail
          rm -rf dist
          gh release download "$TAG" -R "$REPO" -D dist
      - name: 校验 updater feed 与 Windows 安装包
        run: |
          set -euo pipefail
          v="${TAG#v}"
          jq -e --arg v "$v" '.version == $v' dist/latest.json
          url="$(jq -r '.platforms["windows-x86_64"].url // empty' dist/latest.json)"
          sig="$(jq -r '.platforms["windows-x86_64"].signature // empty' dist/latest.json)"
          [ -n "$url" ] && [ -n "$sig" ] || { echo "::error::latest.json 缺 windows-x86_64 的 url/signature"; exit 1; }
          # tauri-action 的 feed 历史上用过 API asset URL（/releases/assets/<id>），
          # 不能只拿 basename 当文件名；两种形状都解析到真正的资产名再查盘。
          if [[ "$url" == *"api.github.com/repos/"*"/releases/assets/"* ]]; then
            asset_id="${url%%\?*}"; asset_id="${asset_id##*/}"
            name="$(gh api "repos/${REPO}/releases/assets/${asset_id}" --jq .name)"
          else
            name="$(basename "${url%%\?*}")"
          fi
          [ -n "$name" ] && [ -f "dist/$name" ] || { echo "::error::feed 指向不存在的资产 $url"; exit 1; }
          ls dist/*-setup.exe >/dev/null
          ls dist/*.sig >/dev/null
          echo "feed version=$v asset=$name"
      - name: 生成并上传 SHA256SUMS（LF）
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" -R "$REPO" SHA256SUMS --clobber
      - uses: actions/attest@v4
        with:
          subject-checksums: dist/SHA256SUMS
      - name: 发布这条 release 并标成 latest
        run: |
          set -euo pipefail
          # 不限定 draft：发布成功后匿名核验失败时，重跑必须能找回这条已发布的 release
          # 重新校验并覆盖 SHA256SUMS/attestation。对已发布的 release，draft=false 是 no-op。
          id="$(gh api "repos/${REPO}/releases?per_page=100"                  --jq "first(.[] | select(.tag_name == \"${TAG}\") | .id)")"
          [ -n "$id" ] || { echo "::error::没找到 ${TAG} 的 release"; exit 1; }
          gh api --method PATCH "repos/${REPO}/releases/${id}" -F draft=false -f make_latest=true >/dev/null
          latest="$(gh api "repos/${REPO}/releases/latest" --jq .tag_name)"
          [ "$latest" = "$TAG" ] || { echo "::error::releases/latest 指着 ${latest}，不是 ${TAG}"; exit 1; }
      - name: 匿名核验 updater feed
        run: |
          set -euo pipefail
          v="${TAG#v}"
          url="https://github.com/${REPO}/releases/latest/download/latest.json"
          for i in $(seq 1 10); do
            body="$(curl -fsSL "$url" 2>/dev/null || true)"
            if [ -n "$body" ] && printf '%s' "$body" | jq -e --arg v "$v"               '.version == $v and (.platforms["windows-x86_64"].url != null)' >/dev/null; then
              echo "anonymous latest.json version=$v"
              exit 0
            fi
            echo "latest.json 尚未就绪（第 ${i}/10 次），60 秒后重试"
            sleep 60
          done
          echo "::error::10 分钟后匿名 latest.json 仍不是 $v"; exit 1
